services:
  db:
    image: mysql:8.0
    container_name: mcp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mcp_db
    ports:
      - "3306:3306"
    volumes:
      - mcp_db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mcp_db_data:
